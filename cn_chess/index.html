<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋 · 人机对战</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>中国象棋</h1>
    <div class="subtitle">人机对战 · 楚河汉界</div>

    <div class="controls">
      <label>难度
        <select id="difficulty">
          <option value="easy">简单</option>
          <option value="medium" selected>中等</option>
          <option value="hard">困难</option>
        </select>
      </label>
      <label>执子
        <select id="side">
          <option value="red" selected>执红（先手）</option>
          <option value="black">执黑（后手）</option>
        </select>
      </label>
      <button class="primary" id="btnNew">新游戏</button>
      <button id="btnUndo">悔棋</button>
      <button id="btnResign">认输</button>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="624" height="688"></canvas>

      <aside class="log-panel" aria-label="棋谱">
        <div class="log-panel-head">
          <span class="log-panel-title">棋谱</span>
          <span class="log-panel-count"><span id="moveCount">0</span> 手</span>
        </div>
        <div class="think-bar">
          <span>电脑思考</span>
          <strong id="thinkTime">—</strong>
        </div>
        <div class="logbox" id="log"></div>
      </aside>
    </div>

    <div class="status" id="status">红方先行，轮到你走棋</div>
    <div class="hint">点击己方棋子选中，再点击亮点落子 · 悔棋撤回一整回合 · 棋谱右侧为每手用时</div>
  </div>

  <!-- 模块按依赖顺序加载：常量 → 规则 → AI → 音效 → 渲染 → 流程 → 启动 -->
  <script src="js/constants.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
