<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER MARIO · 超级玛丽</title>
<style>
  html,body{margin:0;padding:0;background:#0b1220;height:100%;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI","Arial",sans-serif;overflow:hidden;}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
  #stage{position:relative;box-shadow:0 0 60px rgba(120,180,255,.15),0 0 0 3px #182238,0 0 0 5px #0d1524;background:#000;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;color:#fff;font-size:14px;letter-spacing:1px;text-shadow:0 2px 2px rgba(0,0,0,.6);pointer-events:none;font-weight:bold;}
  #hud .coin{color:#ffd23e;}
  #hud .life{color:#ff6b6b;}
  .hint{color:#5a6885;font-size:12px;letter-spacing:1px;line-height:1.7;text-align:center;}
  .hint b{color:#7cc4ff;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="576" tabindex="0"></canvas>
    <div id="hud">
      <span>SCORE <b id="score">0</b></span>
      <span class="coin">🪙 <b id="coins">0</b></span>
      <span>WORLD 1-1</span>
      <span class="life">❤️ <b id="lives">3</b></span>
    </div>
  </div>
  <div class="hint">
    <b>← →</b> 移动 · <b>↑/空格</b> 跳跃 · <b>↓</b> 下蹲<br>
    踩敌人消灭它 · <b>R</b> 重开 · <b>P</b> 暂停 · <b>M</b> 静音
  </div>
</div>

<!-- 模块化加载（普通脚本，file:// 双击即可运行，零构建零依赖） -->
<script src="js/config.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
</body>
</html>
